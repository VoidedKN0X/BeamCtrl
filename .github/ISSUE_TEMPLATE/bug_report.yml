name: Bug report
description: Something in BeamCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please remove anything personal (names, your device's name, personal info) from the text and screenshots below. BeamCtrl doesn't need any of it.

        Found a security problem? Please don't post it here; see [SECURITY.md](https://github.com/VoidedKN0X/BeamCtrl/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you tap, step by step, before it went wrong?
      placeholder: |
        1. Open the Add tab
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
  - type: input
    id: app-version
    attributes:
      label: BeamCtrl version
      description: Tap your profile picture; the version is at the bottom of the You page.
      placeholder: "Profile picture > bottom of the You page, e.g. 0.6.3"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      description: BeamCtrl needs a phone with an IR blaster, so the phone model matters.
      placeholder: "Android 15, Xiaomi 14"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device you're controlling
      description: If the problem is with a remote, which TV or other device is it, and which remote did you use (library, ready-made brand remote or a Flipper file)?
      placeholder: "Samsung TV from 2019, ready-made Samsung remote"
  - type: dropdown
    id: installed-from
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images in here, or paste any error text you saw.
